[package]
name = "mde-music"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-or-later"
description = "Neighbourhood Music — network music client for Jellyfin, Subsonic, and YouTube Music"
authors.workspace = true

[[bin]]
name = "neighbourhood-music"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
dirs = { workspace = true }
gtk4 = { version = "0.9", features = ["v4_14"] }
glib = "0.20"
gio = "0.20"
gstreamer = "0.23"
gstreamer-base = "0.23"
gstreamer-audio = "0.23"
cairo-rs = { version = "0.20", features = ["use_glib"] }
ureq = { version = "2", features = ["json"] }
url = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }
md-5 = "0.10"
sha1 = "0.10"
hex = "0.4"
rss = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
zbus = "5"
zvariant = "5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
base64 = "0.22"
hostname = "0.4"
bytes = "1"
parking_lot = "0.12"
once_cell = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

[dev-dependencies]
tempfile = "3"
