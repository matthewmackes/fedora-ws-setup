[package]
name = "mde-network-neighbourhood"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Network Neighbourhood — Fluent network mounts for MDE"
authors.workspace = true

[[bin]]
name = "network-neighbourhood"
path = "src/main.rs"

[[bin]]
name = "network-neighbourhoodd"
path = "src/bin/network-neighbourhoodd.rs"

[dependencies]
mde-theme = { path = "../mde-theme" }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
gtk4 = { version = "0.9", features = ["v4_14"] }
glib = "0.20"
gio = "0.20"
zbus = "5"
zvariant = "5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "net", "sync", "fs"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = { version = "2", features = ["json"] }
url = "2"
nix = { version = "0.29", default-features = false, features = ["user", "fs"] }
fuser = "0.15"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
