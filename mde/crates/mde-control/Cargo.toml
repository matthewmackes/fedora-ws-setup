[package]
name = "mde-control"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MDE Settings + MMC + Config Editor (Win11 patterns, iced)"

[[bin]]
name = "mde-control"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
iced = { workspace = true, features = ["image"] }
mde-config = { workspace = true }
mde-theme = { workspace = true, features = ["iced", "icons"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
toml = { workspace = true }
