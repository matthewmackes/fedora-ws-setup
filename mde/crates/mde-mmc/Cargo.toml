[package]
name = "mde-mmc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MDE Management Console — primary admin UI (Win MMC patterns + Linux snap-ins)"

[[bin]]
name = "mde-mmc"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
iced = { workspace = true, features = ["tokio", "image"] }
mde-config = { workspace = true }
mde-theme = { workspace = true, features = ["iced", "icons"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = "3"
