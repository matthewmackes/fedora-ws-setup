[package]
name = "mde-anvil"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MDE DRM/TTY compositor core (smithay anvil-based)"
publish = false

[dependencies]
bitflags = "2.2.1"
image = { version = "0.25.1", default-features = false, features = ["png"] }
fps_ticker = { version = "1.0.0", optional = true }
rand = "0.8"
renderdoc = { version = "0.11.0", optional = true }
tracing = { version = "0.1.37", features = ["max_level_trace", "release_max_level_debug"] }
thiserror = "2"
mde-theme = { workspace = true }
mde-config = { workspace = true }
mde-protocol = { workspace = true }
serde_json = { workspace = true }
xcursor = "0.3.3"
xkbcommon = "0.8"
profiling = "1.0"
smithay-drm-extras = { path = "../smithay-drm-extras" }

[dependencies.smithay]
version = "0.7"
default-features = false
features = [
  "desktop",
  "wayland_frontend",
  "backend_libinput",
  "backend_udev",
  "backend_drm",
  "backend_gbm",
  "backend_egl",
  "backend_session_libseat",
  "backend_vulkan",
  "renderer_gl",
  "renderer_pixman",
  "renderer_multi",
  "use_system_lib",
]

[features]
default = ["udev"]
udev = []
# X11 app support via XWayland (runtime still gated by session.xwayland / MDE_XWAYLAND).
xwayland = ["smithay/xwayland"]
# Nested/debug backends (D2) — optional; cfg gates already exist in input_handler.
# x11: feature flag only for now (no x11.rs backend adapted yet; see anvil upstream).
winit = ["smithay/backend_winit"]
x11 = ["smithay/backend_x11"]
debug = ["dep:fps_ticker", "dep:renderdoc"]
renderer_sync = []
egl = []
