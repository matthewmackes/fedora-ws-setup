[package]
name = "mde-theme"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MDE iced/compositor theme tokens (no GTK/Qt bridges)"

[features]
default = []
# iced Theme builder for the shell and Settings. The compositor stays on tokens only.
iced = ["dep:iced"]
# Mackes icon theme lookup. SVG icons are rasterized for iced. The compositor does not enable this.
icons = ["dep:resvg"]

[dependencies]
anyhow = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
iced = { workspace = true, optional = true }
mde-config = { workspace = true }
resvg = { version = "0.44", optional = true }
serde = { workspace = true }
toml = { workspace = true }
